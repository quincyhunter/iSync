name: iOS unsigned IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.2 (iOS 18 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Show Xcode version
        run: |
          xcodebuild -version
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS deps
        working-directory: isync-mobile
        run: npm ci
      - name: Prebuild iOS (generate native project)
        working-directory: isync-mobile
        run: npx expo prebuild -p ios --non-interactive
      - name: CocoaPods install
        working-directory: isync-mobile/ios
        run: |
          sudo xcode-select -s "/Applications/Xcode_16.2.app"
          gem install cocoapods -N || true
          pod repo update
          pod install --verbose
      - name: Build (unsigned)
        working-directory: isync-mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_SCHEME=$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));const n=(c.expo?.name||'App').replace(/[^A-Za-z0-9_]/g,'');process.stdout.write(n)")
          echo "Using app scheme: $APP_SCHEME"
          cd ios
          WS=$(find . -maxdepth 1 -type d -name "*.xcworkspace" -print -quit)
          echo "Workspace: $WS"
          if [ -z "$WS" ]; then
            echo "No .xcworkspace found. Did prebuild/pods run?" >&2
            exit 1
          fi
          xcodebuild -workspace "$WS" -scheme "$APP_SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO clean build | xcpretty
      - name: Package IPA
        working-directory: isync-mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="ios/build/Build/Products/Release-iphoneos"
          echo "Looking under: $APP_DIR"
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Did not find .app in $APP_DIR" >&2
            ls -la "$APP_DIR" || true
            exit 1
          fi
          echo "App path: $APP_PATH"
          rm -rf Payload; mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry isync-mobile-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: isync-mobile-unsigned
          path: isync-mobile/isync-mobile-unsigned.ipa

