name: iOS unsigned IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JS deps
        working-directory: isync-mobile
        run: npm ci
      - name: Prebuild iOS (generate native project)
        working-directory: isync-mobile
        run: npx expo prebuild -p ios --non-interactive
      - name: CocoaPods install
        working-directory: isync-mobile/ios
        run: |
          pod install --repo-update
      - name: Build (unsigned)
        working-directory: isync-mobile
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          WS=$(find . -maxdepth 1 -type d -name "*.xcworkspace" -print -quit)
          echo "Workspace: $WS"
          if [ -z "$WS" ]; then
            echo "No .xcworkspace found. Did prebuild/pods run?" >&2
            exit 1
          fi
          SCHEME=$(xcodebuild -workspace "$WS" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | head -n1 | xargs)
          echo "Detected scheme: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO clean build | xcpretty
      - name: Package IPA
        working-directory: isync-mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n1)
          echo "App path: $APP_PATH"
          rm -rf Payload; mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry isync-mobile-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: isync-mobile-unsigned
          path: isync-mobile/isync-mobile-unsigned.ipa

